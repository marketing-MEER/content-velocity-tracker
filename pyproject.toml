[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "content-velocity-tracker"
version = "1.0.0"
description = "Competitor publishing and update rhythm from sitemap lastmod snapshots"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Meer Hamza", email = "meerhamza5@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "pandas>=1.5", "openpyxl>=3.1", "click>=8.1"]
keywords = ["seo", "content", "velocity", "tracker"]

[project.urls]
Homepage = "https://github.com/marketing-MEER/content-velocity-tracker"
"SEO Toolbox" = "https://github.com/marketing-MEER/seo-toolbox"
LinkedIn = "https://www.linkedin.com/in/meerhamza-seo"

[project.scripts]
content-velocity-tracker = "content_velocity_tracker.cli:main"

[tool.setuptools]
packages = ["content_velocity_tracker"]
